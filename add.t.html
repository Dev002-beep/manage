<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مدرس جديد | AMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root { --primary-color: #6C5CE7; --secondary-color: #A29BFE; --light-color: #F5F6FA; --dark-color: #2D3436; --success-color: #27AE60; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--light-color); color: var(--dark-color); margin: 0; padding: 0; }
        
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        
        .card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary-color); margin-bottom: 10px; }
        .header p { color: #666; font-size: 14px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; font-family: 'Tajawal'; text-align: right; }
        
        .server-selection { margin-top: 30px; background: #f9f9f9; padding: 20px; border-radius: 10px; border: 1px solid #eee; }
        .server-title { font-weight: bold; margin-bottom: 15px; display: block; color: var(--primary-color); }
        
        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        
        .checkbox-item { display: flex; align-items: center; background: white; padding: 10px; border-radius: 6px; border: 1px solid #e0e0e0; cursor: pointer; transition: 0.2s; }
        .checkbox-item:hover { border-color: var(--primary-color); }
        .checkbox-item input { margin-left: 10px; width: 18px; height: 18px; cursor: pointer; }
        .checkbox-item span { font-weight: 500; font-size: 14px; }

        .btn-submit { width: 100%; padding: 15px; background-color: var(--success-color); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; }

        .back-btn { display: inline-block; margin-bottom: 20px; text-decoration: none; color: var(--dark-color); font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .back-btn:hover { color: var(--primary-color); }

        .loading { display: none; width: 24px; height: 24px; border: 3px solid #ffffff; border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Teachers Management Section Styles */
        .teachers-card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 30px; }
        .teachers-list { margin-top: 20px; }
        .teacher-item { background: #f9f9f9; border: 1px solid #eee; border-radius: 10px; padding: 20px; margin-bottom: 20px; transition: all 0.3s ease; }
        .teacher-item:hover { box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .teacher-info { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .teacher-email { font-weight: bold; color: var(--primary-color); font-size: 16px; word-break: break-all; }
        .teacher-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .badge { background-color: var(--secondary-color); color: white; padding: 4px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        .edit-panel { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px dashed #ddd; }
        .edit-panel-title { font-weight: bold; margin-bottom: 12px; display: block; color: var(--primary-color); font-size: 14px; }
        .action-buttons { display: flex; gap: 10px; }
        .btn-small { padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; font-family: 'Tajawal'; transition: all 0.2s; display: flex; align-items: center; gap: 5px; }
        .btn-small:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-edit { background-color: var(--primary-color); color: white; }
        .btn-delete { background-color: #E74C3C; color: white; }
        .btn-save { background-color: var(--success-color); color: white; }
        .btn-cancel { background-color: #95a5a6; color: white; }
        
        .checkbox-grid-small { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 15px; }
        .checkbox-item-small { display: flex; align-items: center; background: white; padding: 8px; border-radius: 6px; border: 1px solid #e0e0e0; cursor: pointer; transition: 0.2s; }
        .checkbox-item-small:hover { border-color: var(--primary-color); }
        .checkbox-item-small input { margin-left: 8px; width: 16px; height: 16px; cursor: pointer; }
        .checkbox-item-small span { font-weight: 500; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <a href="make code.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للوحة التحكم</a> <div class="card">
            <div class="header">
                <h1>إضافة مدرس جديد</h1>
                <p>قم بإنشاء حساب للمدرس وحدد السيرفرات (المراحل) المسموح له بإدارتها.</p>
            </div>

            <form id="addTeacherForm">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" class="form-control" required placeholder="teacher@example.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" class="form-control" required placeholder="******">
                </div>

                <div class="server-selection">
                    <span class="server-title">اختر السيرفرات (المدرسين) لهذا الحساب:</span>
                    <div class="checkbox-grid" id="serversGrid">
                        </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span>إنشاء الحساب</span>
                    <div class="loading" id="loader"></div>
                </button>
            </form>
        </div>

        <div class="card teachers-card">
            <div class="header" style="margin-bottom: 20px;">
                <h1>المدرسون الحاليون وصلاحياتهم</h1>
                <p>تعديل صلاحيات المدرسين بالزيادة والنقصان أو حذف وصولهم تماماً من النظام.</p>
            </div>
            <div id="teachersList" class="teachers-list">
                <p style="text-align: center; color: #666; font-weight: 500;">جاري تحميل المدرسين...</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: 'AIzaSyCdqYrVFspJ4rZwidfaPtc9PYpNlQQm09k',
            appId: '1:284879336757:web:1f42836c2382d11b73087c',
            messagingSenderId: '284879336757',
            projectId: 'amgg-81ac3',
            authDomain: 'amgg-81ac3.firebaseapp.com',
            databaseURL: 'https://amgg-81ac3-default-rtdb.firebaseio.com',
            storageBucket: 'amgg-81ac3.firebasestorage.app',
            measurementId: 'G-FMZW8S6WES',
        };

        // Initialize Main App (For checking Admin)
        const mainApp = firebase.initializeApp(firebaseConfig);
        const mainAuth = mainApp.auth();
        const db = mainApp.database();

        // Admin Guard
        mainAuth.onAuthStateChanged(user => {
            if (user) {
                db.ref(`admins/${user.uid}`).once('value', snapshot => {
                    if (!snapshot.exists()) {
                        alert('غير مصرح لك');
                        window.location.href = 'index.html';
                    } else {
                        loadTeachers();
                    }
                });
            } else {
                window.location.href = 'index.html';
            }
        });

        // 1. Generate Checkboxes
        const grid = document.getElementById('serversGrid');
        for (let i = 1; i <= 25; i++) {
            const label = document.createElement('label');
            label.className = 'checkbox-item';
            label.innerHTML = `
                <input type="checkbox" name="servers" value="مدرس ${i}">
                <span>مدرس ${i}</span>
            `;
            grid.appendChild(label);
        }

        // 2. Handle Form Submit
        document.getElementById('addTeacherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');

            // Get selected servers
            const checkboxes = document.querySelectorAll('input[name="servers"]:checked');
            if (checkboxes.length === 0) {
                alert('يجب اختيار سيرفر واحد على الأقل');
                return;
            }
            
            // Create string like "مدرس 1.مدرس 5"
            let selectedServers = [];
            checkboxes.forEach((cb) => {
                selectedServers.push(cb.value);
            });
            const teaValue = selectedServers.join('.');

            // UI Loading State
            btn.disabled = true;
            btn.querySelector('span').textContent = 'جاري الإنشاء...';
            loader.style.display = 'block';

            try {
                // [CRITICAL TRICK] Create Secondary App to create user WITHOUT logging out Admin
                const secondaryApp = firebase.initializeApp(firebaseConfig, "SecondaryApp");
                const secondaryAuth = secondaryApp.auth();

                // Create the user in Authentication
                const userCredential = await secondaryAuth.createUserWithEmailAndPassword(email, password);
                const newUid = userCredential.user.uid;

                // Save to Realtime Database using Main App (Admin privileges)
                await db.ref('tea/' + newUid).set(teaValue);
                await db.ref('tea_emails/' + newUid).set(email);

                // Cleanup
                await secondaryAuth.signOut();
                await secondaryApp.delete(); // Delete the temp app instance

                alert('تم إنشاء حساب المدرس بنجاح!\n' + 'الصلاحيات: ' + teaValue);
                window.location.reload(); // Reset form

            } catch (error) {
                console.error(error);
                alert('حدث خطأ: ' + error.message);
                btn.disabled = false;
                btn.querySelector('span').textContent = 'إنشاء الحساب';
                loader.style.display = 'none';
            }
        });

        // 3. Load existing teachers
        async function loadTeachers() {
            const teachersListDiv = document.getElementById('teachersList');
            teachersListDiv.innerHTML = '<p style="text-align: center; color: #666; font-weight: 500;">جاري تحميل المدرسين...</p>';
            try {
                const [teaSnap, emailsSnap] = await Promise.all([
                    db.ref('tea').once('value'),
                    db.ref('tea_emails').once('value')
                ]);
                const teaData = teaSnap.val() || {};
                const emailsData = emailsSnap.val() || {};
                
                teachersListDiv.innerHTML = '';
                const uids = Object.keys(teaData);
                if (uids.length === 0) {
                    teachersListDiv.innerHTML = '<p style="text-align: center; color: #666;">لا يوجد مدرسون مسجلون حالياً.</p>';
                    return;
                }
                
                uids.forEach(uid => {
                    const permissionsStr = teaData[uid] || '';
                    const permissions = permissionsStr ? permissionsStr.split('.').map(p => p.trim()) : [];
                    const email = emailsData[uid] || `مدرس (معرف: ${uid.substring(0, 8)}...)`;
                    
                    const item = document.createElement('div');
                    item.className = 'teacher-item';
                    item.id = `teacher-item-${uid}`;
                    
                    // Render badges
                    let badgesHTML = '';
                    if (permissions.length > 0) {
                        permissions.forEach(p => {
                            badgesHTML += `<span class="badge">${p}</span> `;
                        });
                    } else {
                        badgesHTML = '<span class="badge" style="background-color: #e74c3c;">لا توجد صلاحيات</span>';
                    }
                    
                    // Render small checkboxes grid for editing
                    let checkboxesHTML = '';
                    for (let i = 1; i <= 25; i++) {
                        const tName = `مدرس ${i}`;
                        const isChecked = permissions.includes(tName) ? 'checked' : '';
                        checkboxesHTML += `
                            <label class="checkbox-item-small">
                                <input type="checkbox" name="edit-servers-${uid}" value="${tName}" ${isChecked}>
                                <span>${tName}</span>
                            </label>
                        `;
                    }
                    
                    item.innerHTML = `
                        <div class="teacher-info">
                            <div>
                                <div class="teacher-email">${email}</div>
                                <div class="teacher-badges" id="badges-container-${uid}">
                                    ${badgesHTML}
                                </div>
                            </div>
                            <div class="action-buttons">
                                <button class="btn-small btn-edit" onclick="toggleEditPanel('${uid}')">
                                    <i class="fas fa-edit"></i> تعديل الصلاحيات
                                </button>
                                <button class="btn-small btn-delete" onclick="deleteTeacher('${uid}', '${email}')">
                                    <i class="fas fa-trash"></i> حذف
                                </button>
                            </div>
                        </div>
                        
                        <div class="edit-panel" id="edit-panel-${uid}">
                            <span class="edit-panel-title">تعديل السيرفرات (المدرسين) المسموح بها لهذا الحساب:</span>
                            <div class="checkbox-grid-small">
                                ${checkboxesHTML}
                            </div>
                            <div style="display: flex; gap: 10px;">
                                <button class="btn-small btn-save" onclick="saveTeacherPermissions('${uid}')">حفظ التغييرات</button>
                                <button class="btn-small btn-cancel" onclick="toggleEditPanel('${uid}')">إلغاء</button>
                            </div>
                        </div>
                    `;
                    teachersListDiv.appendChild(item);
                });
            } catch (error) {
                console.error(error);
                teachersListDiv.innerHTML = '<p style="text-align: center; color: #e74c3c; font-weight: 500;">حدث خطأ أثناء تحميل البيانات.</p>';
            }
        }

        window.toggleEditPanel = function(uid) {
            const panel = document.getElementById(`edit-panel-${uid}`);
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
            } else {
                panel.style.display = 'block';
            }
        }

        window.saveTeacherPermissions = async function(uid) {
            const checkboxes = document.querySelectorAll(`input[name="edit-servers-${uid}"]:checked`);
            let selectedServers = [];
            checkboxes.forEach((cb) => {
                selectedServers.push(cb.value);
            });
            const newTeaValue = selectedServers.join('.');
            
            const saveBtn = document.querySelector(`#edit-panel-${uid} .btn-save`);
            const originalText = saveBtn.textContent;
            saveBtn.disabled = true;
            saveBtn.textContent = 'جاري الحفظ...';
            
            try {
                await db.ref('tea/' + uid).set(newTeaValue);
                
                // Update badges in UI
                const badgesContainer = document.getElementById(`badges-container-${uid}`);
                badgesContainer.innerHTML = '';
                if (selectedServers.length > 0) {
                    selectedServers.forEach(p => {
                        const span = document.createElement('span');
                        span.className = 'badge';
                        span.textContent = p;
                        badgesContainer.appendChild(span);
                        badgesContainer.appendChild(document.createTextNode(' '));
                    });
                } else {
                    badgesContainer.innerHTML = '<span class="badge" style="background-color: #e74c3c;">لا توجد صلاحيات</span>';
                }
                
                alert('تم تحديث صلاحيات المدرس بنجاح!');
                toggleEditPanel(uid);
            } catch (error) {
                console.error(error);
                alert('حدث خطأ أثناء الحفظ: ' + error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = originalText;
            }
        }

        window.deleteTeacher = async function(uid, email) {
            if (confirm(`هل أنت متأكد تماماً من حذف صلاحيات المدرس "${email}" نهائياً من النظام؟\nهذا الإجراء سيمنعه من تسجيل الدخول.`)) {
                try {
                    await Promise.all([
                        db.ref('tea/' + uid).remove(),
                        db.ref('tea_emails/' + uid).remove()
                    ]);
                    alert('تم حذف صلاحيات وحساب المدرس بنجاح.');
                    const item = document.getElementById(`teacher-item-${uid}`);
                    if (item) item.remove();
                    
                    // If no teachers left, show placeholder
                    const teachersListDiv = document.getElementById('teachersList');
                    if (teachersListDiv.children.length === 0) {
                        teachersListDiv.innerHTML = '<p style="text-align: center; color: #666;">لا يوجد مدرسون مسجلون حالياً.</p>';
                    }
                } catch (error) {
                    console.error(error);
                    alert('حدث خطأ أثناء الحذف: ' + error.message);
                }
            }
        }
    </script>
</body>
</html>
